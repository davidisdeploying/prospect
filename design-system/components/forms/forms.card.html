<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--bg-base);padding:24px;font-family:var(--font-sans)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 24px;max-width:640px}
.stack{display:flex;flex-direction:column;gap:14px}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Input, Select, Textarea, Checkbox, Switch } = window.ProspectDesignSystem_c3fd64;
function Demo(){
  const [remote,setRemote] = React.useState(true);
  const [tail,setTail] = React.useState(false);
  return (
    <div className="grid">
      <Input label="Role" defaultValue="Senior Backend Engineer" />
      <Input label="Comp" mono defaultValue="$185–215k" />
      <Select label="Stage" options={['Showings','Staked','Working the Vein','Strike']} defaultValue="Staked" />
      <div className="stack" style={{justifyContent:'flex-end'}}>
        <Checkbox label="Remote only" checked={remote} onChange={setRemote} />
        <Switch label="Show tailings" checked={tail} onChange={setTail} />
      </div>
      <div style={{gridColumn:'1 / -1'}}>
        <Textarea label="Core samples" rows={3} defaultValue="Hiring manager is ex-Stripe infra. Take-home went well." />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body></html>
