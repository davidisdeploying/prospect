<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-base);padding:24px 28px;font-family:var(--font-mono)}
  .row{display:flex;gap:16px;align-items:flex-end}
  .col{display:flex;flex-direction:column;align-items:center;gap:8px}
  .bar{background:var(--accent);width:100%;border-radius:3px}
  .tk{font-size:10.5px;color:var(--galena)}
  .px{font-size:11px;color:var(--quartz)}
  .cell{display:flex;flex-direction:column;align-items:center;gap:6px}
</style></head>
<body>
  <div class="row">
    <div class="cell"><div class="bar" style="height:4px;width:28px"></div><div class="tk">1</div><div class="px">4</div></div>
    <div class="cell"><div class="bar" style="height:8px;width:28px"></div><div class="tk">2</div><div class="px">8</div></div>
    <div class="cell"><div class="bar" style="height:12px;width:28px"></div><div class="tk">3</div><div class="px">12</div></div>
    <div class="cell"><div class="bar" style="height:16px;width:28px"></div><div class="tk">4</div><div class="px">16</div></div>
    <div class="cell"><div class="bar" style="height:24px;width:28px"></div><div class="tk">6</div><div class="px">24</div></div>
    <div class="cell"><div class="bar" style="height:32px;width:28px"></div><div class="tk">8</div><div class="px">32</div></div>
    <div class="cell"><div class="bar" style="height:48px;width:28px"></div><div class="tk">12</div><div class="px">48</div></div>
    <div class="cell"><div class="bar" style="height:64px;width:28px"></div><div class="tk">16</div><div class="px">64</div></div>
  </div>
</body></html>
