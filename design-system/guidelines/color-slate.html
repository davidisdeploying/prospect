<!-- @dsCard group="Colors" viewport="700x150" name="Slate surface ramp" subtitle="Sunken wells → base → cards → raised. The rock everything sits in." -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-base);padding:22px;font-family:var(--font-sans)}
  .row{display:flex;gap:14px}
  .sw{flex:1;border-radius:var(--r-md);height:96px;border:1px solid var(--line);
      display:flex;flex-direction:column;justify-content:flex-end;padding:10px}
  .name{font-weight:600;font-size:12px;color:var(--quartz)}
  .hex{font-family:var(--font-mono);font-size:11px;color:var(--galena)}
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--slate-900)"><span class="name">Sunken</span><span class="hex">#10171A</span></div>
    <div class="sw" style="background:var(--slate-800)"><span class="name">Base · Wet Slate</span><span class="hex">#1B2327</span></div>
    <div class="sw" style="background:var(--slate-750)"><span class="name">Card</span><span class="hex">#212B2F</span></div>
    <div class="sw" style="background:var(--slate-700)"><span class="name">Raised</span><span class="hex">#283338</span></div>
    <div class="sw" style="background:var(--line)"><span class="name">Line</span><span class="hex">#2E383C</span></div>
  </div>
</body></html>
