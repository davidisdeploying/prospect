<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-base);padding:24px 28px;font-family:var(--font-slab)}
  .row{display:flex;gap:40px;align-items:center}
  .cell{display:flex;flex-direction:column;align-items:center;gap:10px}
  .lockup{display:flex;align-items:center;gap:12px;font-family:var(--font-slab);font-weight:700;font-size:30px;color:var(--text-strong);letter-spacing:-.01em}
  .sub{font-family:var(--font-mono);font-size:10px;color:var(--galena);letter-spacing:.1em;text-transform:uppercase}
  img{display:block}
</style></head>
<body>
  <div class="row">
    <div class="cell"><img src="../assets/prospect-mark.svg" width="64" height="64" alt="Prospect mark"><div class="sub">Primary · 32px+</div></div>
    <div class="cell"><img src="../assets/prospect-mark-compact.svg" width="40" height="40" alt="Compact mark"><div class="sub">Compact · 16–24px</div></div>
    <div class="cell"><div class="lockup"><img src="../assets/prospect-mark.svg" width="40" height="40" alt="">Prospect</div><div class="sub">Lockup</div></div>
  </div>
</body></html>
