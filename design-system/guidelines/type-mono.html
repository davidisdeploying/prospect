<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-base);padding:24px 28px;font-family:var(--font-mono)}
  .row{display:flex;gap:34px;align-items:baseline}
  .big{font-family:var(--font-mono);font-size:40px;font-weight:500;color:var(--quartz);line-height:1}
  .big.hi{color:var(--accent)}
  .k{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--galena);margin-bottom:6px}
  .eb{font-family:var(--font-mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--galena);margin-top:18px}
</style></head>
<body>
  <div class="row">
    <div><div class="k">Claims staked</div><div class="big">18</div></div>
    <div><div class="k">Response rate</div><div class="big">50%</div></div>
    <div><div class="k">Strikes</div><div class="big hi">1</div></div>
    <div><div class="k">Median response</div><div class="big">6d</div></div>
  </div>
  <div class="eb">Job-application tracker</div>
</body></html>
