<!-- @dsCard group="Colors" viewport="700x150" name="Mineral support + text" subtitle="Verdigris (rich), Iron Oxide (tailings), Quartz ink, Galena lines." -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-base);padding:22px;font-family:var(--font-sans)}
  .row{display:flex;gap:14px}
  .sw{flex:1;border-radius:var(--r-md);height:96px;border:1px solid var(--line);
      display:flex;flex-direction:column;justify-content:flex-end;padding:10px}
  .name{font-weight:600;font-size:12px}
  .hex{font-family:var(--font-mono);font-size:11px;opacity:.7}
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--verdigris)"><span class="name" style="color:#fff">Verdigris</span><span class="hex" style="color:#fff">#4C8C78</span></div>
    <div class="sw" style="background:var(--iron-oxide)"><span class="name" style="color:#fff">Iron Oxide</span><span class="hex" style="color:#fff">#A14B33</span></div>
    <div class="sw" style="background:var(--quartz)"><span class="name" style="color:#1B2327">Quartz</span><span class="hex" style="color:#1B2327">#E7E1D3</span></div>
    <div class="sw" style="background:var(--galena)"><span class="name" style="color:#fff">Galena</span><span class="hex" style="color:#fff">#6E767B</span></div>
  </div>
</body></html>
