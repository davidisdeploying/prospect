<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-base);padding:24px 28px;font-family:var(--font-sans)}
  .flow{display:flex;align-items:stretch;gap:0}
  .stage{flex:1;padding:0 14px;border-left:1px solid var(--line)}
  .stage:first-child{border-left:0;padding-left:0}
  .nm{font-family:var(--font-slab);font-weight:600;font-size:15px;color:var(--quartz);line-height:1.1}
  .gl{font-size:11px;color:var(--galena);margin-top:4px}
  .ct{font-family:var(--font-mono);font-size:18px;color:var(--quartz);margin-top:10px}
  .strike .nm,.strike .ct{color:var(--accent)}
  .tail{margin-top:16px;font-size:11px;color:var(--galena)}
  .tail b{color:var(--iron-oxide);font-weight:600}
</style></head>
<body>
  <div class="flow">
    <div class="stage"><div class="nm">Showings</div><div class="gl">Saved</div><div class="ct">42</div></div>
    <div class="stage"><div class="nm">Staked</div><div class="gl">Applied</div><div class="ct">18</div></div>
        <div class="stage"><div class="nm">Working<br>the Vein</div><div class="gl">Interviewing</div><div class="ct">4</div></div>
    <div class="stage strike"><div class="nm">Strike</div><div class="gl">Offer</div><div class="ct">1</div></div>
  </div>
  <div class="tail">Off to the side — <b>Tailings</b> · rejected / dead / withdrawn · the waste rock, reframed as normal.</div>
</body></html>
